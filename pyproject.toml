[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tdd-suite"
version = "3.0.0"
requires-python = ">=3.10"
description = "Комплексная обработка Excel файлов"
authors = [
    {name = "TDD Development Team"}
]
dependencies = [
    "pandas>=2.1.0",
    "openpyxl>=3.1.0",
    "xlsxwriter>=3.0.0",
    "halo>=0.0.31",
    "simple-term-menu==1.6.6; sys_platform != 'win32'"
]

[project.urls]
Repository = "https://github.com/wardlive/TDD"

[project.scripts]
tdd-suite = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["cli*", "config*", "core*", "processors*"]
